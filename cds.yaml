# DualSoft AAS Semantics — ConceptDescription master manifest
# 이 파일이 단일 진실 원천. 모든 JSON 파일은 generate.py 로 재생성 가능.
# ds2 의 AasxSemantics.fs / Concepts/Catalog.fs 와 동기화되어야 함.
#
# ─── 범위 ──────────────────────────────────────────────────────────────────
#   본 카탈로그는 **ds2 자체 발급 CD 만** 정의 (entity / sm / sim 29개).
#   IDTA 표준 SM (Nameplate/HD/TD 등) 의 CD 는 IDTA published .aasx 템플릿이
#   직접 제공하므로 본 리포에 없음. ds2 v2026 이후 export 시 IDTA 템플릿이
#   해당 SM 의 구조/CD/semanticId/언어슬롯의 단일 진실 원천.
#   참조: ds2/Solutions/Convert/Ds2.Aasx/Concepts/Templates/README.md

baseUrl: "https://dualsoftdev.github.io/aas-semantics"

# IEC 61360 dataType 약어:
#   STRING / REAL_MEASURE / INTEGER_COUNT / BOOLEAN / DATE / TIME / TIMESTAMP / ENUM
# unit 은 자유 문자열 (예: "s", "units/h", "%", "ratio (0..1)").
# 빈 값은 omit.

cds:

  # ── ENTITY (11) ──────────────────────────────────────────────────────────
  - path: "entity/Project/1/0"
    idShort: "Project"
    en: "Project"
    de: "Projekt"
    ko: "프로젝트"
    defEn: "Root entity of a DualSoft ds2 project (collection of active/passive systems + metadata)."
    defDe: "Wurzelentität eines DualSoft ds2 Projekts (Sammlung aktiver/passiver Systeme + Metadaten)."
    defKo: "DualSoft ds2 프로젝트의 최상위 엔티티 (활성/패시브 시스템 모음 + 메타데이터)."
    dataType: "STRING"

  - path: "entity/System/1/0"
    idShort: "System"
    en: "Active system"
    de: "Aktives System"
    ko: "활성 시스템"
    defEn: "Active control system (plant/line/cell) composed of flows and devices"
    defDe: "Aktives Steuersystem (Anlage/Linie/Zelle) bestehend aus Flows und Geräten."
    defKo: "Flow 와 Device 로 구성된 능동 제어 시스템 (설비/라인/셀)."
    dataType: "STRING"

  - path: "entity/Device/1/0"
    idShort: "Device"
    en: "Device"
    de: "Gerät"
    ko: "디바이스"
    defEn: "Passive device / actuator / sensor invoked by an active system."
    defDe: "Passives Gerät / Aktor / Sensor, das von einem aktiven System aufgerufen wird."
    defKo: "능동 시스템에서 호출되는 패시브 디바이스 / 액추에이터 / 센서."
    dataType: "STRING"

  - path: "entity/Flow/1/0"
    idShort: "Flow"
    en: "Flow"
    de: "Flow"
    ko: "플로우"
    defEn: "Sequential flow within an active system, composed of work steps."
    defDe: "Sequenzieller Ablauf innerhalb eines aktiven Systems, bestehend aus Arbeitsschritten."
    defKo: "능동 시스템 내부의 순차 흐름 — 여러 Work 로 구성됨."
    dataType: "STRING"

  - path: "entity/Work/1/0"
    idShort: "Work"
    en: "Work step"
    de: "Arbeitsschritt"
    ko: "작업 단계"
    defEn: "Individual work step — a unit of sequence execution with R/G/F/H state machine."
    defDe: "Einzelner Arbeitsschritt — eine Einheit der Sequenzausführung mit R/G/F/H Zustandsmaschine."
    defKo: "단일 작업 단계 — R/G/F/H 상태머신을 가진 시퀀스 실행 단위."
    dataType: "STRING"

  - path: "entity/Call/1/0"
    idShort: "Call"
    en: "Call"
    de: "Aufruf"
    ko: "콜"
    defEn: "Invocation of a device API within a work step (consumer of ApiDef)."
    defDe: "Aufruf einer Geräte-API innerhalb eines Arbeitsschritts (Verbraucher der ApiDef)."
    defKo: "Work 내부에서 디바이스 API 를 호출하는 요소 (ApiDef 의 소비자)."
    dataType: "STRING"

  - path: "entity/ApiDef/1/0"
    idShort: "ApiDef"
    en: "API definition"
    de: "API-Definition"
    ko: "API 정의"
    defEn: "API exposed by a device (signature — input/output tags + behavior)."
    defDe: "Vom Gerät bereitgestellte API (Signatur — Eingangs-/Ausgangstags + Verhalten)."
    defKo: "디바이스가 노출하는 API 정의 (입력/출력 태그 + 동작 시그니처)."
    dataType: "STRING"

  - path: "entity/ApiCall/1/0"
    idShort: "ApiCall"
    en: "API call"
    de: "API-Aufruf"
    ko: "API 호출"
    defEn: "Concrete binding of a Call to an ApiDef with values / tags at runtime."
    defDe: "Konkrete Bindung eines Calls an eine ApiDef mit Werten / Tags zur Laufzeit."
    defKo: "Call 과 ApiDef 의 런타임 바인딩 (실제 값/태그 연결)."
    dataType: "STRING"

  - path: "entity/TokenSpec/1/0"
    idShort: "TokenSpec"
    en: "Token specification"
    de: "Token-Spezifikation"
    ko: "토큰 사양"
    defEn: "Specification of a token type (recipe/product) — maps a token number to data."
    defDe: "Spezifikation eines Token-Typs (Rezept/Produkt) — bildet Token-Nummer auf Daten ab."
    defKo: "토큰 유형 사양 (레시피/제품) — 토큰 번호를 실데이터에 매핑."
    dataType: "STRING"

  - path: "entity/ArrowWork/1/0"
    idShort: "ArrowWork"
    en: "Work transition"
    de: "Arbeitsschritt-Übergang"
    ko: "Work 전이"
    defEn: "Directed edge between work steps — defines reset / sequencing rules."
    defDe: "Gerichtete Kante zwischen Arbeitsschritten — definiert Reset-/Sequenzierungsregeln."
    defKo: "Work 간 방향성 엣지 — 리셋/시퀀스 규칙 정의."
    dataType: "STRING"

  - path: "entity/ArrowCall/1/0"
    idShort: "ArrowCall"
    en: "Call transition"
    de: "Aufruf-Übergang"
    ko: "Call 전이"
    defEn: "Directed edge between Calls within a work step."
    defDe: "Gerichtete Kante zwischen Calls innerhalb eines Arbeitsschritts."
    defKo: "Work 내부 Call 간 방향성 엣지."
    dataType: "STRING"

  # ── SUBMODELS (9) ────────────────────────────────────────────────────────
  - path: "sm/SequenceModel/1/0"
    idShort: "SeqModelSm"
    en: "Sequence model submodel"
    de: "Sequenzmodell-Submodel"
    ko: "시퀀스 모델 서브모델"
    defEn: "Submodel describing the sequence control structure of a ds2 project (Systems/Flows/Works/Calls)."
    defDe: "Submodel zur Beschreibung der Sequenzsteuerungsstruktur eines ds2 Projekts (Systeme/Flows/Works/Calls)."
    defKo: "ds2 프로젝트의 시퀀스 제어 구조(System/Flow/Work/Call)를 기술하는 서브모델."
    dataType: "STRING"

  - path: "sm/SequenceSimulation/1/0"
    idShort: "SeqSimSm"
    en: "Simulation submodel"
    de: "Simulations-Submodel"
    ko: "시뮬레이션 서브모델"
    defEn: "Submodel carrying simulation properties for each System/Flow/Work/Call"
    defDe: "Submodel mit Simulationseigenschaften je System/Flow/Work/Call"
    defKo: "System/Flow/Work/Call 별 시뮬레이션 속성을 담는 서브모델"
    dataType: "STRING"

  - path: "sm/SequenceControl/1/0"
    idShort: "SeqCtrlSm"
    en: "Control submodel"
    de: "Steuerungs-Submodel"
    ko: "제어 서브모델"
    defEn: "Submodel carrying control properties (FBTagMap presets, IO configuration)."
    defDe: "Submodel mit Steuerungseigenschaften (FBTagMap-Presets, IO-Konfiguration)."
    defKo: "제어 속성을 담는 서브모델 (FBTagMap 프리셋, IO 설정)."
    dataType: "STRING"

  - path: "sm/SequenceMonitoring/1/0"
    idShort: "SeqMonSm"
    en: "Monitoring submodel"
    de: "Monitoring-Submodel"
    ko: "모니터링 서브모델"
    defEn: "Submodel carrying monitoring properties (alarm/trend/status)"
    defDe: "Submodel mit Monitoring-Eigenschaften (Alarm/Trend/Status)"
    defKo: "모니터링 속성을 담는 서브모델 (알람/트렌드/상태)"
    dataType: "STRING"

  - path: "sm/SequenceLogging/1/0"
    idShort: "SeqLogSm"
    en: "Logging submodel"
    de: "Logging-Submodel"
    ko: "로깅 서브모델"
    defEn: "Submodel carrying logging properties (data points, retention)."
    defDe: "Submodel mit Logging-Eigenschaften (Datenpunkte, Aufbewahrung)."
    defKo: "로깅 속성을 담는 서브모델 (데이터 포인트, 보존 정책)."
    dataType: "STRING"

  - path: "sm/SequenceMaintenance/1/0"
    idShort: "SeqMaintSm"
    en: "Maintenance submodel"
    de: "Wartungs-Submodel"
    ko: "유지보수 서브모델"
    defEn: "Submodel carrying maintenance properties (intervals, wear parts)."
    defDe: "Submodel mit Wartungseigenschaften (Intervalle, Verschleißteile)."
    defKo: "유지보수 속성을 담는 서브모델 (주기, 마모 부품)."
    dataType: "STRING"

  - path: "sm/SequenceHmi/1/0"
    idShort: "SeqHmiSm"
    en: "HMI submodel"
    de: "HMI-Submodel"
    ko: "HMI 서브모델"
    defEn: "Submodel carrying HMI properties (screens, aliases, controls)."
    defDe: "Submodel mit HMI-Eigenschaften (Bildschirme, Aliase, Bedienelemente)."
    defKo: "HMI 속성을 담는 서브모델 (화면/별칭/조작 요소)"
    dataType: "STRING"

  - path: "sm/SequenceQuality/1/0"
    idShort: "SeqQualSm"
    en: "Quality submodel"
    de: "Qualitäts-Submodel"
    ko: "품질 서브모델"
    defEn: "Submodel carrying quality properties (inspection, SPC, defects)."
    defDe: "Submodel mit Qualitätseigenschaften (Inspektion, SPC, Defekte)."
    defKo: "품질 속성을 담는 서브모델 (검사/SPC/결함)"
    dataType: "STRING"

  - path: "sm/SequenceCostAnalysis/1/0"
    idShort: "SeqCostSm"
    en: "Cost analysis submodel"
    de: "Kostenanalyse-Submodel"
    ko: "비용 분석 서브모델"
    defEn: "Submodel carrying cost analysis properties (material/labor/overhead costs)"
    defDe: "Submodel mit Kostenanalyse-Eigenschaften (Materialkosten, Arbeitskosten, Gemeinkosten)."
    defKo: "비용 분석 속성을 담는 서브모델 (재료비/인건비/간접비)"
    dataType: "STRING"

  # ── SIMULATION (9) ───────────────────────────────────────────────────────
  # NOTE: 본 섹션은 ds2 소스의 simulationConceptDescriptionInfos (Catalog.fs) 와
  #       단일 진실 원천을 공유. 텍스트(en/de/ko/def*) 는 소스와 일치시킨다.
  #
  # PLACEMENT: 모든 sim/* CD 는 SequenceSimulation 서브모델(SeqSimSm) 안의
  #            SystemProperties / SimulationResult SMC 하위에서 참조됨.
  #            (이전엔 TechnicalData 서브모델 안에 있었음 — AAS 표준 SM 분리에 따라 이동)
  - path: "sim/Result/1/0"
    idShort: "SimResult"
    en: "Simulation result"
    de: "Simulationsergebnis"
    ko: "시뮬레이션 결과"
    defEn: "Embedded simulation result (meta + KPI groups) for a single run; placed under SequenceSimulation submodel"
    defDe: "Eingebettetes Simulationsergebnis (Meta + KPI-Gruppen) für einen einzelnen Lauf; im SequenceSimulation-Submodell"
    defKo: "단일 시뮬레이션 실행 결과 (메타 + KPI 그룹) 의 임베디드 표현; SequenceSimulation 서브모델 내 위치"
    dataType: "STRING"

  - path: "sim/Meta/1/0"
    idShort: "SimMeta"
    en: "Simulation metadata"
    de: "Simulationsmetadaten"
    ko: "시뮬레이션 메타데이터"
    defEn: "Provenance: simulator, version, model hash, scenario id, run time, seed"
    defDe: "Provenienz: Simulator, Version, Modell-Hash, Szenario-ID, Laufzeit, Seed"
    defKo: "출처 정보: 시뮬레이터, 버전, 모델 해시, 시나리오 ID, 실행 시각, 시드"
    dataType: "STRING"

  - path: "sim/Kpi/CycleTime/1/0"
    idShort: "CTkpi"
    en: "Cycle time KPI"
    de: "Zykluszeit-KPI"
    ko: "사이클 타임 KPI"
    defEn: "Statistical analysis of cycle time per work step"
    defDe: "Statistische Auswertung der Zykluszeit pro Arbeitsschritt"
    defKo: "Work 별 사이클 타임 통계 분석 (평균/최소/최대/표준편차/CI95)"
    dataType: "REAL_MEASURE"
    unit: "s"
    sourceOfDefinition: "VDI 4500"

  - path: "sim/Kpi/Throughput/1/0"
    idShort: "TPkpi"
    en: "Throughput KPI"
    de: "Durchsatz-KPI"
    ko: "처리량 KPI"
    defEn: "Throughput per hour/day/week/month with takt and cycle time"
    defDe: "Durchsatzkennzahlen je Stunde/Tag/Woche/Monat sowie Takt- und Zykluszeit"
    defKo: "시간/일/주/월별 처리량 + Takt/사이클 타임 지표"
    dataType: "REAL_MEASURE"
    unit: "units/h"
    sourceOfDefinition: "ISA-95 (IEC 62264)"

  - path: "sim/Kpi/Capacity/1/0"
    idShort: "CAPkpi"
    en: "Capacity KPI"
    de: "Kapazitäts-KPI"
    ko: "능력 KPI"
    defEn: "Design, effective, actual, and planned capacity with utilization and bottlenecks"
    defDe: "Design-, Effektiv-, Ist- und Plan-Kapazität mit Auslastung und Engpässen"
    defKo: "설계/실효/실제/계획 능력 + 활용률 + 병목 분석"
    dataType: "REAL_MEASURE"
    unit: "units/h"

  - path: "sim/Kpi/Constraints/1/0"
    idShort: "TOCkpi"
    en: "Constraints KPI"
    de: "Engpass-KPI"
    ko: "제약 KPI"
    defEn: "TOC-based constraint analysis per resource"
    defDe: "TOC-basierte Engpassanalyse je Ressource"
    defKo: "리소스 별 TOC 기반 제약 분석"
    dataType: "STRING"
    sourceOfDefinition: "Theory of Constraints (Goldratt)"

  - path: "sim/Kpi/ResourceUtilization/1/0"
    idShort: "RUkpi"
    en: "Resource utilization KPI"
    de: "Ressourcenauslastung-KPI"
    ko: "리소스 활용 KPI"
    defEn: "Time breakdown and utilization rates per resource"
    defDe: "Zeitliche Aufschlüsselung und Auslastungsraten je Ressource"
    defKo: "리소스 별 시간 분해 (생산/준비/유휴/고장) 및 활용률"
    dataType: "REAL_MEASURE"
    unit: "%"

  - path: "sim/Kpi/OEE/1/0"
    idShort: "OEEkpi"
    en: "OEE KPI"
    de: "OEE-KPI"
    ko: "OEE 지표"
    defEn: "Overall Equipment Effectiveness with availability, performance, and quality"
    defDe: "Overall Equipment Effectiveness mit Verfügbarkeit, Leistung und Qualität"
    defKo: "종합설비효율 (가동률 × 성능률 × 양품률)"
    dataType: "REAL_MEASURE"
    unit: "ratio (0..1)"
    sourceOfDefinition: "ISO 22400-2:2014"

  - path: "sim/Kpi/PerToken/1/0"
    idShort: "PTkpi"
    en: "Per-token KPIs"
    de: "Token-spezifische KPIs"
    ko: "토큰별 KPI"
    defEn: "KPI breakdown per token type (origin/spec) for mixed-flow scenarios"
    defDe: "KPI-Aufschlüsselung je Token-Typ (Origin/Spec) für Mischfluss-Szenarien"
    defKo: "혼류 환경에서 토큰 유형(origin/spec) 별 KPI 분해"
    dataType: "STRING"
